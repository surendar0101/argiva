name: Deploy staging
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && vars.GCP_PROJECT_ID != ''
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      sha: ${{ github.event.workflow_run.head_sha }}
      build: true
