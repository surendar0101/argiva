name: Deploy (reusable)
on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      sha: { type: string, required: true }
      build: { type: boolean, required: true }
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPOSITORY }}/web:${{ inputs.sha }}
      SHA: ${{ inputs.sha }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      APP_ENV: ${{ vars.APP_ENV }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      INSTAGRAM_URL: ${{ vars.INSTAGRAM_URL }}
      DATABASE_URL_SECRET: ${{ vars.DATABASE_URL_SECRET }}
      MAX_INSTANCES: ${{ vars.CLOUD_RUN_MAX_INSTANCES }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Installed before signing in to Google, so package install scripts never see cloud credentials.
      - name: Install database tools
        run: |
          pnpm install --frozen-lockfile --filter "@argiva/db..."
          pnpm --filter "@argiva/db^..." run build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        if: inputs.build
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --build-arg APP_VERSION="$SHA" -t "$IMAGE" .
          docker push "$IMAGE"
      # Runs before the new version goes live. A failure here stops the deploy.
      # The database address stays inside this step and is masked in the log.
      - name: Migrate database and load reference data
        env:
          STORAGE_DRIVER: local
          STORAGE_LOCAL_DIR: /tmp/uploads
        run: |
          set -euo pipefail
          DATABASE_URL="$(gcloud secrets versions access latest --secret="$DATABASE_URL_SECRET")"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          pnpm --filter @argiva/db db:migrate
          pnpm --filter @argiva/db db:seed
      - name: Deploy to Cloud Run
        # STORAGE_DRIVER=local is temporary: nothing stores files until Phase 3/4, which switches to R2.
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" \
            --service-account "$RUNTIME_SA" --allow-unauthenticated --port 8080 \
            --cpu 1 --memory 512Mi --min-instances 0 --max-instances "$MAX_INSTANCES" --concurrency 80 \
            --set-env-vars "APP_ENV=$APP_ENV,APP_BASE_URL=$APP_BASE_URL,INSTAGRAM_URL=$INSTAGRAM_URL,APP_VERSION=$SHA,STORAGE_DRIVER=local,STORAGE_LOCAL_DIR=/tmp/uploads" \
            --set-secrets "DATABASE_URL=$DATABASE_URL_SECRET:latest"
      - name: Smoke test
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          if [ "$APP_ENV" = "production" ]; then node scripts/smoke.mjs "$URL"; else node scripts/smoke.mjs "$URL" --noindex; fi
